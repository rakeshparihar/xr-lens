<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XR Lens</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #0f1115; color: #e8e8ea; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    video { width: 100%; border-radius: 12px; background: #000; cursor: crosshair; }
    button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #3b82f6; color: #fff; }
    #log { padding-left: 18px; color: #c8ccd2; font-variant-numeric: tabular-nums; }
    .stage { position: relative; }
    .tag { position: absolute; transform: translate(-50%, -50%); padding: 4px 10px; border-radius: 999px; background: rgba(20, 20, 24, .85);
           color: #fff; font: 600 13px system-ui, sans-serif; white-space: nowrap; pointer-events: none; border: 2px solid #9aa0a6; }
    .tag.edge { border-color: #22c55e; } .tag.cloud { border-color: #3b82f6; }
  </style>
</head>
<body>
  <main id="overlay">
    <h1>Point and ask</h1>
    <p id="status">Starting…</p>
    <p class="legend">Green: answered on the device. Blue: sent to the cloud model.</p>
    <button id="ar" hidden>Start AR</button>
    <div class="stage"><video id="video" playsinline muted></video></div>
    <ul id="log"></ul>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

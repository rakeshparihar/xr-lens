name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc
      - run: npx vitest run
      - name: Report matches the raw runs
        run: |
          npx vite-node bench/sweep.ts > /dev/null
          git diff --exit-code bench/results/RESULTS.md
